[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dargus-cli"
version = "0.19.0"
description = "Clinical efficacy prediction system for drug-development researchers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Dargus Team"}
]
keywords = ["drug-discovery", "clinical-efficacy", "agent-system", "bioinformatics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Slim hard dependencies: exactly what the package imports. The scientific
# stack lives in optional-dependency groups so a first install stays lean
# (torch arrives transitively via sentence-transformers).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "litellm>=1.40",
    "sentence-transformers>=2.2",
    "prompt-toolkit>=3",
]

[project.optional-dependencies]
# Scientific / modeling stack — opt-in capabilities (T7).
docking = ["vina>=1.2", "rdkit>=2023.9.1"]
modeling = ["pymc>=5.10", "pytensor>=2.18"]
analysis = [
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
literature = ["PyMuPDF>=1.23", "biopython>=1.81"]
admet = ["admet-ai"]
singlecell = ["scanpy>=1.9", "scvi-tools>=1.0"]
genetics = ["coloc", "ldsc"]
llm = ["httpx>=0.27"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.6",
]
all = [
    "dargus-cli[docking,modeling,analysis,literature,admet,singlecell,genetics,llm,dev]",
]

[project.scripts]
dargus = "dargus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dargus*"]

# Runtime data files must ship in the wheel: a wheel install finds its config,
# field registry, and vocabularies without the source tree (T7).
[tool.setuptools.package-data]
dargus = [
    "config/*.yaml",
    "dbase/*.yaml",
    "dbase/vocabularies.json",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["dargus/tests"]
