# D-Base v1.0.0 — Three-Axis Field Registry (50 fields)
# Logical dotted paths (x.type, y.value, bg.disease_id) are stable_keys.
# R=required, C=conditional, D=writer-derived, O=optional.
# "identity": true = participates in evidence_id computation.
# Sidecar fields (status, superseded_by, llm_summary, embedding) are NOT here;
# they live in sidecars/*.jsonl keyed by evidence_id (see design/2.2).

groups:
  identity:
    description: "Record identity and primary provenance"
    fields:
      - stable_key: evidence_id
        type: str
        derived: true
        identity: false
        description: "Content-addressed id: ev_ + sha256(canonical_json(identity))[:16]"

      - stable_key: biological_level
        type: enum
        required: true
        identity: true
        vocabulary_ref: biological_level
        description: "One of 11 values; determines conditional requirements"

      - stable_key: is_clinical
        type: int
        derived: true
        identity: false
        description: "Writer-derived; 1 for rct/epi, 0 for all others incl. rct-sim"

      - stable_key: evidence_design
        type: enum
        required: true
        identity: false
        vocabulary_ref: evidence_design
        description: "7-value evidence structure type"

      - stable_key: sources
        type: object[]
        required: true
        identity: true
        description: "[{rank: int, type: enum(source_type), name: str}]. Exactly one rank=1. Sorted before hashing."

      - stable_key: source_entry
        type: str
        required: true
        identity: true
        description: "Primary source entry id: accession / DOI / PMID / PMCID / sim-model version"

      - stable_key: source_time
        type: str
        required: true
        identity: true
        description: "Primary source time (update/publication), ISO-8601 preferred"

  xy:
    description: "Data-point count axis"
    fields:
      - stable_key: xy.count
        type: int
        required: true
        identity: false
        description: "1 descriptive / 2 pairwise / >=3 sequential or dose-response. Determines array lengths."

  x:
    description: "Experimental variable axis"
    fields:
      - stable_key: x.type
        type: enum
        required: true
        identity: true
        vocabulary_ref: x_type
        description: "One of 5 values"

      - stable_key: x.unit
        type: str
        required: false
        condition: "required when x.type is concentration or time"
        identity: false
        description: "Unit of x.value"

      - stable_key: x.value
        type: object[]
        required: true
        identity: true
        description: "Ordered array, len=xy.count"

  y:
    description: "Measurement axis"
    fields:
      - stable_key: y.type
        type: str
        required: true
        identity: true
        description: "Endpoint name (free text)"

      - stable_key: y.category
        type: enum
        required: true
        identity: false
        vocabulary_ref: y_category
        description: "23-value endpoint category; routing filter"

      - stable_key: y.unit
        type: str
        required: false
        identity: false
        description: "Unit of the outcome measurement"

      - stable_key: y.to_basis
        type: enum
        required: false
        identity: false
        vocabulary_ref: y_to_basis
        description: "absolute / change / fold_change / log2_fold_change / log10_fold_change"

      - stable_key: y.value
        type: number[]
        required: true
        identity: false
        description: "Ordered array, len=xy.count"

      - stable_key: y.dispersion
        type: object[]
        required: false
        identity: false
        description: "[{type: enum(y_dispersion_type), value: number}], len=xy.count. CI95 lives here."

      - stable_key: y.n_total
        type: int[]
        required: false
        identity: false
        description: "Sample sizes, len=xy.count"

      - stable_key: y.events
        type: int[]
        required: false
        identity: false
        description: "Event counts for binary/TTE outcomes, len=xy.count"

      - stable_key: y.p_value
        type: float[]
        required: false
        identity: false
        description: "Each in [0,1], len=xy.count"

      - stable_key: y.direction
        type: enum
        required: false
        condition: "required for comparative designs"
        identity: false
        vocabulary_ref: y_direction
        description: "beneficial / harmful / neutral"

      - stable_key: y.effect
        type: object
        required: false
        identity: false
        description: "{value, value_type: enum(y_effect_value_type), dispersion, dispersion_type: enum(y_effect_dispersion_type)}"

      - stable_key: y.assay
        type: str
        required: false
        condition: "required for non-clinical records"
        identity: false
        description: "Assay or measurement platform (e.g. IncuCyte, ELISA)"

  bg:
    description: "Background axis — shared context for all measurements"
    fields:
      - stable_key: bg.disease_id
        type: curie[]
        required: false
        condition: "required for clinical levels (rct/epi); optional otherwise"
        identity: true
        description: "Disease CURIEs (sorted before hashing)"

      - stable_key: bg.drugs
        type: object[]
        required: false
        identity: false
        description: "[{entity_id, entity_label, dose?}]"

      - stable_key: bg.genes
        type: object[]
        required: false
        identity: false
        description: "[{entity_id, entity_label, alteration?}]"

      - stable_key: bg.model
        type: str
        required: false
        identity: false
        description: "Non-clinical modeling method; disallowed for clinical records"

      - stable_key: bg.dose_value
        type: number
        required: false
        identity: true
        description: "Dose or exposure amount"

      - stable_key: bg.dose_unit
        type: str
        required: false
        identity: true
        description: "Unit for bg.dose_value (mg/kg, uM, ...)"

      - stable_key: bg.duration_value
        type: number
        required: false
        identity: false
        description: "Duration of exposure or observation"

      - stable_key: bg.duration_unit
        type: str
        required: false
        identity: false
        description: "Unit for bg.duration_value (hours, days, weeks, ...)"

      - stable_key: bg.phenotype
        type: curie[]
        required: false
        identity: false
        description: "HPO phenotype CURIEs"

  sample:
    description: "Biological source and subject descriptors"
    fields:
      - stable_key: cell_line_id
        type: curie
        required: false
        condition: "required for non-clinical cellular-or-higher records; disallowed for clinical"
        identity: true
        description: "Cellosaurus CURIE"

      - stable_key: model_organism
        type: curie
        required: false
        identity: true
        description: "NCBITaxon CURIE"

      - stable_key: strain
        type: str
        required: false
        identity: true
        description: "Strain or breed"

      - stable_key: sex
        type: enum
        required: false
        identity: true
        vocabulary_ref: sex
        description: "male / female / mixed"

      - stable_key: age
        type: str
        required: false
        identity: false
        description: "Age descriptor (free text, e.g. 8_weeks, adults_18_65)"

      - stable_key: tissue
        type: curie
        required: false
        identity: false
        description: "UBERON tissue CURIE"

      - stable_key: cell_type
        type: curie
        required: false
        identity: false
        description: "CL cell type CURIE"

      - stable_key: exvivo_platform
        type: str
        required: false
        condition: "required for exvivo/exvivo-sim"
        identity: false
        description: "Ex vivo platform (e.g. organoid)"

  clinical:
    description: "Clinical trial design (clinical levels only)"
    fields:
      - stable_key: clinical_design.comparator_type
        type: enum
        required: false
        condition: "required for comparative clinical designs"
        identity: true
        vocabulary_ref: comparator_type
        description: "placebo / active / standard_of_care / no_treatment"

      - stable_key: clinical_design.blinding
        type: enum
        required: false
        identity: false
        vocabulary_ref: blinding
        description: "open_label / single / double / triple"

      - stable_key: clinical_design.randomized
        type: bool
        required: false
        identity: false
        description: "Whether participants were randomized"

      - stable_key: clinical_design.phase
        type: enum
        required: false
        identity: true
        vocabulary_ref: phase
        description: "phase_1 / phase_2 / phase_3 / phase_4"

      - stable_key: clinical_design.n_arms
        type: int
        required: false
        identity: false
        description: "Number of arms"

      - stable_key: clinical_design.population
        type: enum
        required: false
        identity: true
        vocabulary_ref: population
        description: "adults / elderly_65_plus / pediatric / pregnant / other"

      - stable_key: clinical_design.study_id
        type: curie
        required: false
        identity: true
        description: "clinicaltrials:NCT... preferred"

  metadata:
    description: "Cross-record links and study context"
    fields:
      - stable_key: related_evidence_id
        type: str[]
        required: false
        identity: true
        description: "evidence_ids from the same experiment/publication/simulation run"

      - stable_key: is_primary_endpoint
        type: bool
        required: false
        identity: false
        description: "True if primary endpoint in the source study"

      - stable_key: p_value_adjusted
        type: bool
        required: false
        identity: false
        description: "True if p-values were adjusted for multiplicity"
