methodology_registry:
  transcriptomics:
    - method: "RNA-seq (bulk)"
      citation: "Mortazavi et al., 2008, Nat Methods"
      guidelines: ["ENCODE RNA-seq guidelines", "MINSEQE standard"]
      benchmarks: ["SEQC project"]
    - method: "scRNA-seq (10x Genomics)"
      citation: "Zheng et al., 2017, Nat Commun"
      guidelines: ["10x Genomics Best Practices"]
      benchmarks: ["scIB"]
  crispr_screening:
    - method: "CRISPR-Cas9 knockout screen (pooled)"
      citation: "Shalem et al., 2014, Science"
      guidelines: ["DepMap SOP"]
      benchmarks: ["DepMap 24Q2"]
  drug_sensitivity:
    - method: "CellTiter-Glo"
      citation: "Crouch et al., 1993, J Immunol Methods"
      guidelines: []
      benchmarks: ["GDSC", "CTRP v2"]
