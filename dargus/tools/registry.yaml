# Dargus Tool Registry v0.16.0
# Standardized tool definitions with typed I/O schemas.
# Field naming aligned with D-Base field_registry.yaml.

tools:
  dbase_query:
    description: "Query the D-Base evidence store by drug/disease/biological_level filters"
    domain: core
    biological_levels: [molecular, molecular-sim, cellular, cellular-sim, exvivo, exvivo-sim, animal, animal-sim, rct, epi, rct-sim]
    parameters:
      x_entity:
        type: string
        required: false
        description: "Intervention/drug identifier (CURIE format, e.g. chembl:CHEMBL25)"
      disease_id:
        type: string
        required: false
        description: "Disease identifier (MONDO format, e.g. MONDO:0005148)"
      y_type:
        type: string
        required: false
        description: "Readout/endpoint type to filter by"
      y_category:
        type: string
        required: false
        description: "Readout category to filter by"
      level:
        type: string
        required: false
        description: "Filter by biological evidence level"
      evidence_design:
        type: string
        required: false
        description: "Filter by evidence design (e.g. two_arm_comparison)"
      limit:
        type: integer
        required: false
        default: 100
        description: "Maximum number of records to return"
    output:
      type: object
      properties:
        records: {type: array}
        count: {type: integer}
    timeout_ms: 5000
    fallback: empty_list

  dbase_write:
    description: "Write an evidence record to D-Base with automatic embedding generation"
    domain: core
    biological_levels: [molecular, molecular-sim, cellular, cellular-sim, exvivo, exvivo-sim, animal, animal-sim, rct, epi, rct-sim]
    parameters:
      record:
        type: object
        required: true
        description: "Three-axis evidence dict to write"
    output:
      type: object
      properties:
        evidence_id: {type: string}
        written: {type: boolean}
        embedding_generated: {type: boolean}
    timeout_ms: 10000
    fallback: empty_list

  dbase_status:
    description: "Get D-Base status and statistics"
    domain: core
    biological_levels: [molecular, molecular-sim, cellular, cellular-sim, exvivo, exvivo-sim, animal, animal-sim, rct, epi, rct-sim]
    parameters: {}
    output:
      type: object
      properties:
        record_count: {type: integer}
        shard_count: {type: integer}
        has_parquet_view: {type: boolean}
    timeout_ms: 3000
    fallback: empty_list

  dbase_update_status:
    description: "Append a lifecycle status transition (supersede, retract, holdout) to the status sidecar"
    domain: core
    biological_levels: [molecular, molecular-sim, cellular, cellular-sim, exvivo, exvivo-sim, animal, animal-sim, rct, epi, rct-sim]
    parameters:
      evidence_id:
        type: string
        required: true
        description: "Target evidence record id"
      status:
        type: string
        required: true
        enum: [active, superseded, retracted, holdout-test, holdout-valid]
        description: "New lifecycle status"
      superseded_by:
        type: string
        required: false
        description: "Replacement evidence_id when status is superseded"
    output:
      type: object
      properties:
        evidence_id: {type: string}
        status: {type: string}
    timeout_ms: 3000
    fallback: empty_list

  dbase_write_summary:
    description: "Write or replace the LLM summary sidecar entry for a record"
    domain: core
    biological_levels: [molecular, molecular-sim, cellular, cellular-sim, exvivo, exvivo-sim, animal, animal-sim, rct, epi, rct-sim]
    parameters:
      evidence_id:
        type: string
        required: true
        description: "Target evidence record id"
      summary:
        type: string
        required: true
        description: "LLM summary text"
    output:
      type: object
      properties:
        evidence_id: {type: string}
        written: {type: boolean}
    timeout_ms: 3000
    fallback: empty_list

  embedding:
    description: "Embed texts with the project-level embedding model (ToolCache-resident); embed/test/info ops"
    domain: core
    biological_levels: [molecular, molecular-sim, cellular, cellular-sim, exvivo, exvivo-sim, animal, animal-sim, rct, epi, rct-sim]
    parameters:
      texts:
        type: array
        required: false
        description: "Texts to embed (embed/test ops)"
      op:
        type: string
        required: false
        default: embed
        enum: [embed, test, info]
        description: "Operation: embed texts, self-test, or model info"
    output:
      type: object
      properties:
        vectors: {type: array}
        model_name: {type: string}
    timeout_ms: 60000
    fallback: empty_list

  pubmed_search:
    description: "Search PubMed for biomedical literature"
    domain: literature
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      query:
        type: string
        required: true
        description: "PubMed search query string"
      max_results:
        type: integer
        required: false
        default: 10
        description: "Maximum number of results"
    output:
      type: array
      items: PubmedArticle
    timeout_ms: 15000
    fallback: empty_list

  iris_search:
    description: "Keyword and structured search prediction over D-Base evidence"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true, description: "List of drug identifiers"}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
      properties:
        efficacy_score: {type: float}
        confidence_score: {type: float}
    timeout_ms: 30000
    fallback: null_result

  iris_analog:
    description: "Drug analog similarity-based efficacy prediction"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
    timeout_ms: 60000
    fallback: null_result

  iris_bayes:
    description: "Bayesian hierarchical model for efficacy meta-analysis"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
    timeout_ms: 120000
    fallback: null_result

  iris_gnn:
    description: "Graph neural network drug-disease efficacy prediction"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
    timeout_ms: 180000
    fallback: null_result

  iris_llm:
    description: "LLM-based evidence synthesis and reasoning"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
    timeout_ms: 120000
    fallback: null_result
