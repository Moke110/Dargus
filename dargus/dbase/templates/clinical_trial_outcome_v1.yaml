template_id: clinical_trial_outcome_v1
description: Clinical trial outcome record.
fields:
  - name: biological_level
    type: factor
    vocabulary: [clinical]
  - name: drug_id
    type: factor
    vocabulary_ref: global_drug_vocab
  - name: disease_id
    type: factor
    vocabulary_ref: global_disease_vocab
  - name: endpoint
    type: factor
    vocabulary_ref: global_endpoint_vocab
  - name: fold_change
    type: float
  - name: fold_change_sem
    type: float
    optional: true
  - name: ci95_lower
    type: float
    optional: true
  - name: ci95_upper
    type: float
    optional: true
  - name: sample_size
    type: int
    optional: true
  - name: phase
    type: factor
    vocabulary: [I, II, III]
    optional: true
