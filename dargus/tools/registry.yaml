# Dargus Tool Registry v0.16.0
# Standardized tool definitions with typed I/O schemas.
# Field naming aligned with D-Base field_registry.yaml.

tools:
  dbase_query:
    description: "Query D-Base by drug/disease/biological_level filters"
    domain: core
    biological_levels: [molecular, molecular-sim, cellular, cellular-sim, exvivo, exvivo-sim, animal, animal-sim, rct, epi, rct-sim]
    parameters:
      drug_id:
        type: string
        required: false
        description: "Drug identifier (CURIE format, e.g. chembl:CHEMBL25)"
      disease_id:
        type: string
        required: false
        description: "Disease identifier (MONDO format, e.g. MONDO:0005148)"
      biological_level:
        type: string
        required: false
        description: "Filter by biological evidence level"
      limit:
        type: integer
        required: false
        default: 100
        description: "Maximum number of records to return"
    output:
      type: array
      items: EvidenceRecord
    timeout_ms: 5000
    fallback: empty_list

  pubmed_search:
    description: "Search PubMed for biomedical literature"
    domain: literature
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      query:
        type: string
        required: true
        description: "PubMed search query string"
      max_results:
        type: integer
        required: false
        default: 10
        description: "Maximum number of results"
    output:
      type: array
      items: PubmedArticle
    timeout_ms: 15000
    fallback: empty_list

  iris_search:
    description: "Keyword and structured search prediction over D-Base evidence"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true, description: "List of drug identifiers"}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
      properties:
        efficacy_low: {type: float}
        efficacy_up: {type: float}
    timeout_ms: 30000
    fallback: null_result

  iris_analog:
    description: "Drug analog similarity-based efficacy prediction"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
    timeout_ms: 60000
    fallback: null_result

  iris_bayes:
    description: "Bayesian hierarchical model for efficacy meta-analysis"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
    timeout_ms: 120000
    fallback: null_result

  iris_gnn:
    description: "Graph neural network drug-disease efficacy prediction"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
    timeout_ms: 180000
    fallback: null_result

  iris_llm:
    description: "LLM-based evidence synthesis and reasoning"
    domain: iris
    biological_levels: [molecular, cellular, exvivo, animal, rct, epi]
    parameters:
      drug_ids: {type: array, required: true}
      disease_id: {type: string, required: true}
      endpoints: {type: array, required: false, default: []}
    output:
      type: object
    timeout_ms: 120000
    fallback: null_result
